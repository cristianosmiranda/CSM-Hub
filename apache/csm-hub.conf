# Install this file as /etc/httpd/conf.d/csm-hub.conf.
# Adjust DocumentRoot if CSM-Hub is mounted elsewhere.

<Directory "/var/www/html/csm-hub">
    Options -Indexes
    AllowOverride None
    Require all granted

    DirectoryIndex index.html
    ErrorDocument 404 /csm-hub/httpd-erro-padrao.html
</Directory>
